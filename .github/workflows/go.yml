name: Go Application CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      - name: Check Go format
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following Go files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Lint with go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

      - name: Start server in background
        run: |
          PORT=8080 go run main.go &
          sleep 5  # Give the server time to start

      - name: Test routes
        run: |
          # Test health endpoint
          curl -f http://localhost:8080/api/health || exit 1

      - name: Stop server
        run: pkill -f "main.go"

  # Real-Postgres integration suite: every endpoint through the production
  # router, with query counts and statuses checked against
  # src/integration/testdata/query_baseline.json. testcontainers starts
  # postgres:17-alpine on the runner's Docker.
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet integration-tagged code
        run: go vet -tags integration ./...

      - name: Run integration tests
        env:
          # Fail instead of skipping if Docker is unavailable.
          TESTDB_REQUIRE: "1"
        run: make test-integration
